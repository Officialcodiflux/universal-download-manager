name: Build Windows release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist
      - name: Package browser extension
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File integration/package-extension.ps1
      - name: Check auto-update files
        shell: powershell
        run: |
          # latest.yml and the blockmap must come from this same build as the
          # installer; electron-updater rejects a mismatched latest.yml.
          foreach ($file in 'release/UDM-Setup.exe', 'release/UDM-Setup.exe.blockmap', 'release/latest.yml') {
            if (-not (Test-Path $file)) { throw "Missing $file" }
          }
      - name: Create SHA-256 file
        shell: powershell
        run: |
          $extension = Get-ChildItem release-extension/UDM-Extension-*.zip | Select-Object -First 1
          $lines = foreach ($file in @((Get-Item release/UDM-Setup.exe), $extension)) {
            (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower() + '  ' + $file.Name
          }
          $lines | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-windows-release-candidate
          path: |
            release/UDM-Setup.exe
            release/UDM-Setup.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
            release-extension/UDM-Extension-*.zip
          if-no-files-found: error
          retention-days: 7
